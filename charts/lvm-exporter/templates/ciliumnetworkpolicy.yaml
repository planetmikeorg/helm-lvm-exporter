{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "lvm-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lvm-exporter.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "lvm-exporter.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": {{ .Values.networkPolicy.prometheusNamespace | quote }}
            {{- range $key, $value := .Values.networkPolicy.prometheusPodSelector }}
            {{ $key }}: {{ $value }}
            {{- end }}
      toPorts:
        - ports:
            - port: "{{ .Values.service.targetPort }}"
              protocol: TCP
{{- end }}
