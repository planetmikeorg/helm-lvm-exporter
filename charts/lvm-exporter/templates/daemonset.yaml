apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lvm-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lvm-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "lvm-exporter.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if .Values.updateStrategy.rollingUpdate }}
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "lvm-exporter.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lvm-exporter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      containers:
        - name: lvm-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --web.listen-address=:{{ .Values.service.targetPort }}
            - --web.telemetry-path=/metrics
          ports:
            - name: metrics
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: run-lvm
              mountPath: /run/lvm
              readOnly: true
            - name: etc-lvm
              mountPath: /etc/lvm
              readOnly: true
            - name: var-lib-lvm
              mountPath: /var/lib/lvm
              readOnly: true
            - name: dev
              mountPath: /dev
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: run-lvm
          hostPath:
            path: {{ .Values.hostPaths.runLvm.path | quote }}
            type: {{ .Values.hostPaths.runLvm.type | quote }}
        - name: etc-lvm
          hostPath:
            path: {{ .Values.hostPaths.etcLvm.path | quote }}
            type: {{ .Values.hostPaths.etcLvm.type | quote }}
        - name: var-lib-lvm
          hostPath:
            path: {{ .Values.hostPaths.varLibLvm.path | quote }}
            type: {{ .Values.hostPaths.varLibLvm.type | quote }}
        - name: dev
          hostPath:
            path: {{ .Values.hostPaths.dev.path | quote }}
            type: {{ .Values.hostPaths.dev.type | quote }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
