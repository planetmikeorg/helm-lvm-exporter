{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lvm-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lvm-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lvm-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace }}
          podSelector:
            matchLabels:
              {{- range $key, $value := .Values.networkPolicy.prometheusPodSelector }}
              {{ $key }}: {{ $value }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
